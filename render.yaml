databases:
  - name: taskapp-db
    databaseName: taskapp
    user: taskapp

services:
  - type: web
    name: taskapp-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskapp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true